name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: powershell
        run: ./scripts/build.ps1
      - name: Synthetic protocol tests
        shell: powershell
        run: ./tests/run-tests.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: CodexHistoryArchiver-windows-preview
          path: dist/
          if-no-files-found: error

